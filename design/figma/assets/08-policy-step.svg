<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="100%" height="100%" fill="#f6f8fb"/><rect x="0" y="0" width="1440" height="96" rx="0" fill="#0f172a" opacity="1"/><text x="42" y="57" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="start">CorpNotify</text><rect x="810" y="26" width="136" height="42" rx="10" fill="#1e293b" opacity="1"/><text x="878" y="53" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="middle">1  ประกาศ</text><rect x="960" y="26" width="136" height="42" rx="10" fill="#2563eb" opacity="1"/><text x="1028" y="53" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2  นโยบาย</text><rect x="1110" y="26" width="136" height="42" rx="10" fill="#1e293b" opacity="1"/><text x="1178" y="53" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="middle">3  แบบทดสอบ</text><rect x="0" y="96" width="1440" height="48" rx="0" fill="#fff" opacity="1"/><text x="46" y="126" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="start">กรุณาอ่านนโยบายทั้งหมด แล้วเลื่อนลงด้านล่างสุดเพื่อเปิดใช้งานปุ่มรับทราบ</text><rect x="120" y="176" width="1200" height="540" rx="18" fill="#fff" opacity="1" stroke="#e6eaf0" stroke-width="1"/><text x="156" y="216" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="24" font-weight="800" fill="#101828" text-anchor="start">Policy การใช้งานระบบ IT และ AI อย่างปลอดภัย</text><line x1="156" y1="238" x2="1284" y2="238" stroke="#e6eaf0" stroke-width="1"/><text x="160" y="292" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">1. ดูแลรหัสผ่านของตนเองและห้ามเปิดเผยให้ผู้อื่น</text><text x="160" y="358" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">2. ระวังอีเมล ลิงก์ และไฟล์แนบจากแหล่งที่ไม่รู้จัก</text><text x="160" y="424" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">3. ห้ามนำข้อมูลลับของบริษัทเข้าสู่ AI โดยไม่ได้รับอนุญาต</text><text x="160" y="490" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="15" font-weight="600" fill="#334155" text-anchor="start">4. หากพบเหตุการณ์ผิดปกติให้แจ้งฝ่าย IT ทันที</text><rect x="0" y="822" width="1440" height="78" rx="0" fill="#fff" opacity="1"/><line x1="0" y1="822" x2="1440" y2="822" stroke="#e6eaf0" stroke-width="1"/><text x="48" y="867" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="12" font-weight="400" fill="#667085" text-anchor="start">อ่านเนื้อหาให้ครบเพื่อดำเนินการต่อ</text><rect x="1180" y="840" width="200" height="44" rx="10" fill="#cbd5e1" opacity="1"/><text x="1280" y="868" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">เลื่อนลงเพื่ออ่านต่อ</text></svg>